<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>دفتر الكريدي - إدارة الديون والمتجر</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --glass-border: rgba(255, 255, 255, 0.65);
  --cyan: #00eaff;
  --purple: #a34cff;
  --ink: #ffffff;
  --ink-dim: rgba(240, 248, 255, 0.88);
  --green-txt: #4ade80;
  --red-txt: #ff5c77;
  --warn-txt: #fbbf24;
  --blur: blur(28px) saturate(150%);
}

:root[data-theme="dark"] {
  --glass-border: rgba(165, 243, 252, 0.42);
  --ink-dim: rgba(224, 242, 254, 0.82);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
html, body { height: 100%; }

body {
  font-family: "Cairo", system-ui, sans-serif;
  color: var(--ink);
  min-height: 100vh;
  background:
    radial-gradient(circle at 10% 10%, #00dfff 0%, transparent 35%),
    radial-gradient(circle at 90% 10%, #a52bff 0%, transparent 35%),
    radial-gradient(circle at 10% 90%, #8c22ff 0%, transparent 35%),
    radial-gradient(circle at 90% 90%, #00d9ff 0%, transparent 35%),
    linear-gradient(135deg, #003b91, #075bdc, #001d69);
  background-attachment: fixed;
  overflow-x: hidden;
  position: relative;
}

:root[data-theme="dark"] body {
  background:
    radial-gradient(circle at 10% 10%, rgba(0, 223, 255, 0.45) 0%, transparent 36%),
    radial-gradient(circle at 90% 10%, rgba(165, 43, 255, 0.45) 0%, transparent 36%),
    radial-gradient(circle at 10% 90%, rgba(140, 34, 255, 0.42) 0%, transparent 36%),
    radial-gradient(circle at 90% 90%, rgba(0, 217, 255, 0.42) 0%, transparent 36%),
    linear-gradient(135deg, #011438, #04245e, #010b26);
}

body::before,
body::after {
  content: "";
  position: fixed;
  width: 350px;
  height: 350px;
  border-radius: 50%;
  filter: blur(110px);
  pointer-events: none;
  z-index: 0;
}

body::before {
  background: #00eaff;
  top: -130px;
  left: -120px;
  opacity: 0.85;
}

body::after {
  background: #a000ff;
  bottom: -150px;
  right: -100px;
  opacity: 0.85;
}

.bubble {
  position: fixed;
  border-radius: 50%;
  pointer-events: none;
  background: radial-gradient(
    circle at 30% 25%,
    rgba(255, 255, 255, 0.78),
    rgba(100, 220, 255, 0.25) 40%,
    rgba(0, 60, 180, 0.2)
  );
  border: 1px solid rgba(255, 255, 255, 0.45);
  box-shadow:
    inset 0 0 15px rgba(255, 255, 255, 0.4),
    0 0 20px rgba(0, 230, 255, 0.25);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  z-index: 0;
}
.bubble-1 { width: 85px; height: 85px; top: 14%; left: 4%; }
.bubble-2 { width: 105px; height: 105px; top: 18%; right: 3%; }
.bubble-3 { width: 50px; height: 50px; top: 64%; left: 2%; }
.bubble-4 { width: 110px; height: 110px; bottom: 8%; right: 5%; }

#app {
  position: relative;
  z-index: 1;
  max-width: 440px;
  margin: 0 auto;
  min-height: 100%;
  padding: calc(12px + env(safe-area-inset-top, 0px)) 14px 124px;
  display: flex;
  flex-direction: column;
}

/* ==========================================================================
   واجهة تسجيل الدخول وإنشاء الحساب (Liquid Glass Login UI)
   ========================================================================== */
.lq-auth-wrap {
  position: relative;
  z-index: 2;
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 12px 0;
  min-height: calc(100vh - 30px);
}

.login-card {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 440px;
  padding: 30px 22px 26px;
  border-radius: 38px;
  background: linear-gradient(
    135deg,
    rgba(255, 255, 255, 0.19),
    rgba(20, 100, 220, 0.12),
    rgba(160, 80, 255, 0.17)
  );
  border: 1.5px solid var(--glass-border);
  backdrop-filter: blur(30px);
  -webkit-backdrop-filter: blur(30px);
  box-shadow:
    inset 0 0 25px rgba(255, 255, 255, 0.17),
    0 0 30px rgba(0, 220, 255, 0.22),
    0 20px 60px rgba(0, 0, 40, 0.3);
  overflow: hidden;
}

.login-card::before {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  background: linear-gradient(
    125deg,
    rgba(255, 255, 255, 0.22),
    transparent 35%,
    transparent 70%,
    rgba(0, 255, 255, 0.12)
  );
  pointer-events: none;
}

.lq-avatar {
  position: relative;
  z-index: 1;
  width: 86px;
  height: 86px;
  margin: 0 auto 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  background: linear-gradient(135deg, rgba(0, 210, 255, 0.55), rgba(100, 50, 255, 0.6));
  border: 2px solid rgba(255, 255, 255, 0.7);
  box-shadow:
    0 0 20px rgba(0, 230, 255, 0.6),
    inset 0 0 20px rgba(255, 255, 255, 0.25);
}

.lq-avatar svg {
  width: 46px;
  height: 46px;
  fill: white;
}

.lq-title {
  position: relative;
  color: white;
  font-size: 28px;
  font-weight: 900;
  text-align: center;
  margin: 0 0 4px;
  text-shadow: 0 2px 10px rgba(0, 0, 40, 0.25);
}

.lq-subtitle {
  position: relative;
  color: rgba(255, 255, 255, 0.88);
  text-align: center;
  font-size: 13.5px;
  font-weight: 600;
  margin: 0 0 22px;
}

.input-box {
  position: relative;
  height: 56px;
  display: flex;
  align-items: center;
  padding: 0 15px;
  margin-bottom: 14px;
  border-radius: 20px;
  border: 1px solid rgba(255, 255, 255, 0.55);
  background: rgba(255, 255, 255, 0.14);
  box-shadow:
    inset 0 0 12px rgba(255, 255, 255, 0.1),
    0 0 12px rgba(0, 200, 255, 0.13);
  transition: .25s;
}

.input-box:focus-within {
  border-color: #72faff;
  box-shadow: 0 0 18px rgba(0, 235, 255, 0.4);
}

.input-box svg {
  width: 23px;
  height: 23px;
  stroke: white;
  fill: none;
  stroke-width: 2;
  flex-shrink: 0;
}

.input-box input {
  width: 100%;
  min-width: 0;
  border: none;
  outline: none;
  background: transparent;
  color: white;
  font: inherit;
  font-size: 14.5px;
  font-weight: 700;
  padding: 0 12px;
}

.input-box input::placeholder {
  color: rgba(255, 255, 255, 0.82);
}

.eye {
  cursor: pointer;
  opacity: .9;
  transition: .2s;
}
.eye:hover {
  opacity: 1;
  filter: drop-shadow(0 0 5px white);
}

.options {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  margin: 14px 4px 18px;
  color: white;
  font-size: 13px;
  font-weight: 700;
}

.remember {
  display: flex;
  align-items: center;
  gap: 7px;
  cursor: pointer;
}

.remember input {
  accent-color: #00eaff;
  width: 16px;
  height: 16px;
  cursor: pointer;
}

.forgot-link {
  background: transparent;
  border: 0;
  color: white;
  font: inherit;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  padding: 0;
}
.forgot-link:hover { text-decoration: underline; }

.login-btn {
  position: relative;
  width: 100%;
  height: 56px;
  border: 1px solid white;
  border-radius: 20px;
  background: linear-gradient(110deg, #00eaff, #8cefff, #b58aff);
  color: #00245f;
  font: inherit;
  font-size: 18px;
  font-weight: 900;
  cursor: pointer;
  box-shadow:
    0 0 20px rgba(0, 230, 255, 0.5),
    inset 0 2px 8px white;
  transition: .25s;
}
.login-btn:active { transform: scale(0.98); }
.login-btn:disabled { opacity: 0.7; cursor: wait; }

.divider {
  display: flex;
  align-items: center;
  gap: 14px;
  color: white;
  font-size: 13px;
  font-weight: 700;
  margin: 16px 0;
}
.divider::before,
.divider::after {
  content: "";
  flex: 1;
  height: 1px;
  background: rgba(255, 255, 255, 0.5);
}

.google-btn {
  width: 100%;
  height: 54px;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 11px;
  border-radius: 20px;
  border: 1px solid rgba(255, 255, 255, 0.85);
  background: linear-gradient(120deg, rgba(255, 255, 255, 0.92), rgba(210, 235, 255, 0.78));
  color: #092c70;
  font: inherit;
  font-size: 15px;
  font-weight: 800;
  cursor: pointer;
  box-shadow:
    0 0 18px rgba(0, 220, 255, 0.3),
    inset 0 2px 8px white;
  transition: .25s;
}
.google-btn:active { transform: scale(0.98); }
.google-btn:disabled { opacity: 0.7; cursor: wait; }

.create-account-btn {
  width: 100%;
  height: 54px;
  margin-top: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  border-radius: 20px;
  border: 1px solid rgba(255, 255, 255, 0.8);
  background: rgba(255, 255, 255, 0.10);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  color: white;
  font: inherit;
  font-size: 15px;
  font-weight: 800;
  cursor: pointer;
  box-shadow:
    inset 0 0 12px rgba(255, 255, 255, 0.15),
    0 0 15px rgba(0, 220, 255, 0.25);
  transition: .25s;
}
.create-account-btn:active { transform: scale(0.98); }
.create-account-btn svg {
  width: 23px;
  height: 23px;
  fill: none;
  stroke: white;
  stroke-width: 1.8;
  flex-shrink: 0;
}

.guest-link {
  display: block;
  margin: 16px auto 0;
  background: transparent;
  border: 0;
  color: rgba(255, 255, 255, 0.92);
  font: inherit;
  font-size: 13px;
  font-weight: 700;
  text-decoration: underline;
  text-underline-offset: 4px;
  cursor: pointer;
}

/* ==========================================================================
   تطبيق هوية Liquid Glass على جميع صفحات التطبيق
   ========================================================================== */
.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 13px;
  gap: 8px;
}

.brand-wrap {
  display: flex;
  align-items: center;
  gap: 7px;
  font-size: 19px;
  font-weight: 900;
  text-shadow: 0 2px 10px rgba(0, 0, 40, 0.35);
  cursor: pointer;
  padding: 5px 14px;
  border-radius: 999px;
  background: linear-gradient(135deg, rgba(255, 255, 255, 0.18), rgba(160, 80, 255, 0.14));
  border: 1px solid rgba(255, 255, 255, 0.45);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  box-shadow: inset 0 0 12px rgba(255, 255, 255, 0.15), 0 0 16px rgba(0, 220, 255, 0.22);
  transition: transform 0.15s ease;
  max-width: 68%;
}
.brand-wrap span:first-child {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.brand-wrap:active { transform: scale(0.97); }

.edit-hint {
  opacity: 0.85;
  display: inline-flex;
  align-items: center;
  flex: none;
}

.glass-circle {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: linear-gradient(135deg, rgba(255, 255, 255, 0.22), rgba(20, 100, 220, 0.14), rgba(160, 80, 255, 0.2));
  border: 1.5px solid var(--glass-border);
  box-shadow: inset 0 0 12px rgba(255, 255, 255, 0.2), 0 0 16px rgba(0, 230, 255, 0.28);
  backdrop-filter: var(--blur);
  -webkit-backdrop-filter: var(--blur);
  color: #fff;
  display: grid;
  place-items: center;
  cursor: pointer;
  position: relative;
  transition: transform 0.15s ease;
  flex: none;
  overflow: hidden;
  padding: 0;
  font-weight: 900;
  font-size: 18px;
}
.glass-circle:active { transform: scale(0.92); }
.glass-circle img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.sync-dot {
  position: absolute;
  bottom: 1px;
  right: 1px;
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: #00eaff;
  border: 1.5px solid #00245f;
  box-shadow: 0 0 8px #00eaff;
}
.sync-dot.syncing { background: #a34cff; animation: pulse 1s infinite; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }

/* شريط التبويبات: العملاء / الموردون */
.seg-wrap {
  display: flex;
  background: linear-gradient(135deg, rgba(255, 255, 255, 0.18), rgba(20, 100, 220, 0.12), rgba(160, 80, 255, 0.16));
  border: 1.5px solid var(--glass-border);
  border-radius: 24px;
  padding: 4px;
  margin-bottom: 12px;
  box-shadow: inset 0 0 18px rgba(255, 255, 255, 0.15), 0 0 22px rgba(0, 220, 255, 0.2);
  backdrop-filter: var(--blur);
  -webkit-backdrop-filter: var(--blur);
}

.seg-btn {
  flex: 1;
  border: 1px solid transparent;
  background: transparent;
  color: rgba(255, 255, 255, 0.9);
  font: inherit;
  font-weight: 800;
  font-size: 14px;
  padding: 8px 10px;
  border-radius: 20px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  transition: all 0.22s ease;
}

.seg-btn.active {
  background: linear-gradient(110deg, #00eaff, #8cefff, #b58aff);
  color: #00245f;
  border: 1px solid #ffffff;
  box-shadow: 0 0 18px rgba(0, 230, 255, 0.48), inset 0 2px 6px #ffffff;
}
.seg-btn.active svg circle,
.seg-btn.active svg rect,
.seg-btn.active svg path {
  stroke: #00245f;
}

/* البطاقات المالية: لي وعليّ */
.cards-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 12px;
}

.stat-card {
  position: relative;
  border-radius: 24px;
  padding: 11px 11px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
  backdrop-filter: var(--blur);
  -webkit-backdrop-filter: var(--blur);
  overflow: hidden;
  border: 1.5px solid var(--glass-border);
  box-shadow: inset 0 0 18px rgba(255, 255, 255, 0.16), 0 0 22px rgba(0, 220, 255, 0.2);
}

.stat-card::before {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(125deg, rgba(255, 255, 255, 0.24), transparent 45%);
  pointer-events: none;
}

.stat-card.green {
  background: linear-gradient(135deg, rgba(255, 255, 255, 0.2), rgba(0, 234, 255, 0.22), rgba(16, 185, 129, 0.22));
}

.stat-card.red {
  background: linear-gradient(135deg, rgba(255, 255, 255, 0.2), rgba(163, 76, 255, 0.24), rgba(244, 63, 94, 0.2));
}

.stat-info {
  text-align: center;
  flex: 1;
}

.stat-label {
  font-size: 12px;
  font-weight: 800;
  color: #ffffff;
  line-height: 1.2;
}

.stat-val {
  font-size: 16.5px;
  font-weight: 900;
  letter-spacing: -0.3px;
  direction: ltr;
  display: inline-block;
  line-height: 1.35;
}

.stat-card.green .stat-val {
  color: #6ee7b7;
  text-shadow: 0 0 12px rgba(0, 234, 255, 0.45);
}

.stat-card.red .stat-val {
  color: #fda4af;
  text-shadow: 0 0 12px rgba(163, 76, 255, 0.45);
}

.icon-3d-box {
  width: 34px;
  height: 34px;
  border-radius: 12px;
  display: grid;
  place-items: center;
  flex: none;
  border: 1px solid rgba(255, 255, 255, 0.7);
}

.icon-3d-box.green {
  background: linear-gradient(135deg, #00eaff, #10b981);
  box-shadow: 0 0 14px rgba(0, 234, 255, 0.45), inset 0 1px 3px #ffffff;
}

.icon-3d-box.red {
  background: linear-gradient(135deg, #a34cff, #f43f5e);
  box-shadow: 0 0 14px rgba(163, 76, 255, 0.45), inset 0 1px 3px #ffffff;
}

/* شريط البحث والفلتر + شريط الفلاتر السريعة */
.search-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 9px;
}

.search-box {
  flex: 1;
  position: relative;
  display: flex;
  align-items: center;
}

.search-box input {
  width: 100%;
  height: 44px;
  border-radius: 20px;
  border: 1px solid rgba(255, 255, 255, 0.58);
  background: rgba(255, 255, 255, 0.14);
  box-shadow: inset 0 0 12px rgba(255, 255, 255, 0.12), 0 0 14px rgba(0, 200, 255, 0.16);
  backdrop-filter: var(--blur);
  -webkit-backdrop-filter: var(--blur);
  color: #fff;
  font: inherit;
  font-size: 13.5px;
  font-weight: 700;
  padding: 0 40px 0 14px;
  outline: none;
  transition: .25s;
}

.search-box input:focus {
  border-color: #72faff;
  box-shadow: 0 0 18px rgba(0, 235, 255, 0.42);
}

.search-box input::placeholder {
  color: rgba(255, 255, 255, 0.82);
}

.search-icon {
  position: absolute;
  right: 14px;
  pointer-events: none;
  opacity: 0.95;
  display: grid;
}

.filter-btn {
  width: 44px;
  height: 44px;
  border-radius: 18px;
  border: 1px solid rgba(255, 255, 255, 0.6);
  background: linear-gradient(135deg, rgba(255, 255, 255, 0.2), rgba(160, 80, 255, 0.18));
  box-shadow: inset 0 0 12px rgba(255, 255, 255, 0.15), 0 0 14px rgba(0, 220, 255, 0.2);
  backdrop-filter: var(--blur);
  -webkit-backdrop-filter: var(--blur);
  color: #fff;
  display: grid;
  place-items: center;
  cursor: pointer;
  flex: none;
}
.filter-btn.active {
  background: linear-gradient(110deg, #00eaff, #8cefff, #b58aff);
  border-color: #ffffff;
  box-shadow: 0 0 20px rgba(0, 230, 255, 0.55);
}
.filter-btn.active svg { stroke: #00245f; }

.chips-row {
  display: flex;
  gap: 7px;
  overflow-x: auto;
  padding-bottom: 4px;
  margin-bottom: 10px;
  scrollbar-width: none;
}
.chips-row::-webkit-scrollbar { display: none; }

.chip-btn {
  flex: none;
  border-radius: 999px;
  padding: 5px 12px;
  font: inherit;
  font-size: 12px;
  font-weight: 800;
  color: #fff;
  background: rgba(255, 255, 255, 0.14);
  border: 1px solid rgba(255, 255, 255, 0.45);
  backdrop-filter: blur(14px);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  transition: 0.2s;
}
.chip-btn.active {
  background: linear-gradient(110deg, #00eaff, #8cefff);
  color: #00245f;
  border-color: #fff;
  box-shadow: 0 0 14px rgba(0, 234, 255, 0.45);
}
.chip-btn.warn.active {
  background: linear-gradient(110deg, #fbbf24, #fde68a);
  color: #451a03;
}

/* شارات التنبيه والتأخير */
.badge-pill {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  font-size: 10.5px;
  font-weight: 800;
  padding: 1.5px 8px;
  border-radius: 999px;
  margin-top: 3px;
}
.badge-pill.overdue {
  background: rgba(244, 63, 94, 0.35);
  border: 1px solid rgba(253, 164, 175, 0.75);
  color: #ffe4e6;
}
.badge-pill.upcoming {
  background: rgba(251, 191, 36, 0.28);
  border: 1px solid rgba(253, 230, 138, 0.7);
  color: #fef3c7;
}

/* بطاقات القائمة الزجاجية السائلة */
.glass-card {
  position: relative;
  background: linear-gradient(
    135deg,
    rgba(255, 255, 255, 0.19),
    rgba(20, 100, 220, 0.12),
    rgba(160, 80, 255, 0.16)
  );
  border: 1.5px solid rgba(255, 255, 255, 0.55);
  border-radius: 24px;
  padding: 11px 13px;
  margin-bottom: 9px;
  display: flex;
  align-items: center;
  gap: 11px;
  box-shadow: inset 0 0 18px rgba(255, 255, 255, 0.14), 0 0 20px rgba(0, 220, 255, 0.16);
  backdrop-filter: var(--blur);
  -webkit-backdrop-filter: var(--blur);
  cursor: pointer;
  transition: transform 0.15s ease, box-shadow 0.2s ease;
  overflow: hidden;
}
.glass-card.is-overdue {
  border-color: rgba(253, 164, 175, 0.85);
  box-shadow: inset 0 0 18px rgba(244, 63, 94, 0.22), 0 0 18px rgba(244, 63, 94, 0.28);
}
.glass-card::before {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(125deg, rgba(255, 255, 255, 0.2), transparent 40%);
  pointer-events: none;
}
.glass-card:active { transform: scale(0.985); }

.avatar-3d {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  background: linear-gradient(135deg, rgba(0, 210, 255, 0.6), rgba(100, 50, 255, 0.65));
  border: 1.5px solid rgba(255, 255, 255, 0.75);

  function loadLocalData() {
    try {
      var raw = localStorage.getItem(storageKeyForUser());
      if (!raw && currentUser && currentUser.isGuest) raw = localStorage.getItem(LOCAL_BASE_KEY);
      if (raw) {

  var cloudSaveTimer = null;
  var dirty = false, inflight = 0, lastWriteAt = 0;
  function save(quiet) {
    try { localStorage.setItem(storageKeyForUser(), JSON.stringify(S)); } catch (e) {}

    if (db && currentUser && !currentUser.isGuest) {
      var uid = currentUser.uid;
      var payload = {
        p: S.p,
        l: S.l,
        n: S.n,
        s: S.s,
        email: currentUser.email || "",
        displayName: currentUser.displayName || ""
      };
      dirty = true;
      syncState = "syncing";
      if (!quiet) render();
      clearTimeout(cloudSaveTimer);
      cloudSaveTimer = setTimeout(function () {
        dirty = false;
        inflight++;
        lastWriteAt = Date.now();
        payload.updatedAt = lastWriteAt;
        db.collection("users").doc(uid).set(payload, { merge: true }).then(function () {
          inflight--;
          if (!dirty && inflight === 0) syncState = "synced";
          if (!quiet) render();
        }).catch(function () {
          inflight--;
          syncState = "offline";
          if (!quiet) render();
        });
      }, 350);
    }
  }

  function bindUserCloudData(user) {
    if (unsubDoc) { unsubDoc(); unsubDoc = null; }
    dirty = false; lastWriteAt = 0;
    currentUser = user;
    loadLocalData();

    if (!db || !user || user.isGuest) {
      syncState = "offline";
      render();
      return;
    }

    syncState = "syncing";
    render();

    var userRef = db.collection("users").doc(user.uid);
    userRef.get().then(function (snap) {
      if (snap.exists) {
        S = normalizeState(snap.data());
        try { localStorage.setItem(storageKeyForUser(), JSON.stringify(S)); } catch (e) {}
      } else {
        userRef.set({
          p: S.p,
          l: S.l,
          n: S.n,
          s: S.s,
          email: user.email || "",
          displayName: user.displayName || "",
          createdAt: Date.now(),
          updatedAt: Date.now()
        });
      }
      syncState = "synced";
      render();

      unsubDoc = userRef.onSnapshot(function (s) {
        if (s.metadata.hasPendingWrites || !s.exists) return;
        /* تجاهل أي لقطة قديمة أثناء وجود تعديلات محلية لم تُرسل أو لم تُؤكد بعد */
        if (dirty || inflight > 0) return;
        var data = s.data();
        if ((Number(data.updatedAt) || 0) < lastWriteAt) return;
        var incoming = normalizeState(data);
        if (JSON.stringify(incoming) === JSON.stringify(S)) return;
        S = incoming;
        try { localStorage.setItem(storageKeyForUser(), JSON.stringify(S)); } catch (e) {}
        render();
      });
    }).catch(function () {
      syncState = "offline";
      render();
    });
  }

  function mapAuthError(code) {
    switch (code) {
      case "auth/invalid-email": return "صيغة البريد الإلكتروني غير صحيحة";
      case "auth/user-not-found":
      case "auth/wrong-password":
      case "auth/invalid-credential": return "البريد الإلكتروني أو كلمة المرور غير صحيحة";
      case "auth/email-already-in-use": return "هذا البريد الإلكتروني مسجل بالفعل، سجّل الدخول";
      case "auth/weak-password": return "كلمة المرور يجب أن تكون 6 أحرف على الأقل";
      case "auth/operation-not-allowed": return "فعّل خيار البريد الإلكتروني في Authentication داخل Firebase";
      case "auth/unauthorized-domain": return "أضف رابط موقعك في Authorized domains داخل Firebase";
      case "auth/too-many-requests": return "محاولات كثيرة، انتظر قليلاً ثم حاول مجدداً";
      default: return "حدث خطأ: " + (code || "تأكد من الاتصال بالإنترنت");
    }
  }

  function handleEmailSubmit() {
    if (!auth) {
      showToast("خدمة السحابة غير متاحة حالياً، اضغط على (الدخول بدون حساب) بالأسفل");
      return;
    }
    var email = ($("#auth-email") && $("#auth-email").value || "").trim();
    var password = ($("#auth-password") && $("#auth-password").value) || "";
    var fullName = ($("#auth-name") && $("#auth-name").value || "").trim();
    var remember = $("#auth-remember") ? $("#auth-remember").checked : true;

    if (!email) { showToast("يرجى إدخال البريد الإلكتروني"); return; }

    if (authMode === "reset") {
      authBusy = true;
      render();
      auth.sendPasswordResetEmail(email).then(function () {
        showToast("تم إرسال رابط استعادة كلمة المرور إلى بريدك");
        authMode = "login";
      }).catch(function (err) {
        showToast(mapAuthError(err && err.code));
      }).finally(function () {
        authBusy = false;
        render();
      });
      return;
    }

    if (!password) { showToast("يرجى إدخال كلمة المرور"); return; }

    authBusy = true;
    render();
    var pers = remember ? firebase.auth.Auth.Persistence.LOCAL : firebase.auth.Auth.Persistence.SESSION;
    auth.setPersistence(pers).then(function () {
      if (authMode === "register") {
        return auth.createUserWithEmailAndPassword(email, password).then(function (cred) {
          if (fullName && cred.user) {
            return cred.user.updateProfile({ displayName: fullName });
          }
        }).then(function () {
          showToast("تم إنشاء حسابك بنجاح");
        });
      } else {
        return auth.signInWithEmailAndPassword(email, password).then(function () {
          showToast("مرحباً بعودتك");
        });
      }
    }).catch(function (err) {
      showToast(mapAuthError(err && err.code));
    }).finally(function () {
      authBusy = false;
      render();
    });
  }

  function handleGoogleLogin() {

    });
  }

  }

        var pEdit = S.p.find(function (x) { return x.id === sel; });
        var nEdit = $("#nm").value.trim();
        var phEdit = $("#ph") ? $("#ph").value.trim() : "";
        if (pEdit && nEdit) { pEdit.n = nEdit; pEdit.ph = phEdit; }
      } else if (sheet === "edittitle") {
        var val = $("#ttl").value.trim();
        S.s = val || "دفتر الكريدي";
      } else {
        var a = parseFloat($("#am").value);
        if (!(a > 0)) return;
        var m = $("#nt").value.trim();
        var due = $("#due-dt") ? $("#due-dt").value.trim() : "";
        var syncStore = $("#sync-store") ? $("#sync-store").checked : false;
        var now = Date.now();
        var x = { k: sheet, a: a, m: m, d: now };
        if (due) x.due = due;
        if (sheet === "i" || sheet === "o") {
          S.l.push(x);
        } else {
          var pTx = S.p.find(function (p) { return p.id === sel; });
          pTx.x.push(x);
          if (syncStore) {
            S.l.push({
              k: sheet === "t" ? "i" : "o",
              a: a,
              m: (sheet === "t" ? "دفعة من " : "دفعة لـ ") + pTx.n + (m ? " (" + m + ")" : ""),
              d: now + 1
            });
            showToast(sheet === "t" ? "تم الحفظ وإضافة المبلغ لمداخيل المتجر" : "تم الحفظ وخصم المبلغ من مصاريف المتجر");
          }
        }
      }
      sheet = null;
      save();
    }
    else if ("delx" in d) {
      var pDelX = S.p.find(function (x) { return x.id === sel; });
      pDelX.x = pDelX.x.filter(function (x) { return x.d !== +d.delx; });
      save();
    }
    else if ("dell" in d) {
      S.l = S.l.filter(function (x) { return x.d !== +d.dell; });
      save();
    }
    else if ("delp" in d) {
      var pDel = S.p.find(function (x) { return x.id === +d.delp; });
      if (!pDel) return;
      cf = { m: "سيتم حذف «" + pDel.n + "» وجميع معاملاته نهائياً. هل أنت متأكد؟", a: "delp", id: pDel.id };
    }
    else if ("cfno" in d) { cf = null; }
    else if ("cfok" in d) {
      if (cf.a === "reset") { S = normalizeState({}); tab = "c"; q = ""; sel = null; V = "list"; }
      else if (cf.a === "delp") { S.p = S.p.filter(function (p) { return p.id !== cf.id; }); V = "list"; sel = null; }
      cf = null;
      save();
    }
    else if ("themeSet" in d) { setTheme(d.themeSet); }
    else if ("reset" in d) { cf = { m: "سيتم مسح جميع بيانات هذا الحساب والعودة إلى الصفر. هل أنت متأكد؟", a: "reset" }; }

    render();
  });

  document.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !currentUser && e.target && (e.target.id === "auth-email" || e.target.id === "auth-password" || e.target.id === "auth-name")) {
      e.preventDefault();
      handleEmailSubmit();
    }
  });

  document.addEventListener("input", function (e) {
    if (e.target.id === "sn") { S.s = e.target.value.trim(); save(true); }
    if (e.target.id === "q") { q = e.target.value; render(); }
  });

  /* 1. إذا كان وضع الضيف مفعلاً مسبقاً، حمّل البيانات المحلية فوراً */
  try {
    if (localStorage.getItem(GUEST_MODE_KEY) === "1") {
      currentUser = { uid: "local-user", displayName: "حساب محلي", email: "محفوظ على هذا الجهاز", isGuest: true };
      loadLocalData();
    }
  } catch (e) {}

  /* 2. ارسم الواجهة فوراً دون انتظار أي ملف خارجي */
  render();

  /* 3. حمّل مكتبات Firebase في الخلفية بأمان */
  initFirebaseBackground();
})();
</script>
</body>
</html>
