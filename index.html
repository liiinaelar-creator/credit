<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>دفتر الكريدي - إدارة الديون والمتجر</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --glass-border: rgba(255, 255, 255, 0.65);
  --cyan: #00eaff;
  --purple: #a34cff;
  --ink: #ffffff;
  --ink-dim: rgba(240, 248, 255, 0.88);
  --green-txt: #4ade80;
  --red-txt: #ff5c77;
  --warn-txt: #fbbf24;
  --blur: blur(28px) saturate(150%);
}

:root[data-theme="dark"] {
  --glass-border: rgba(165, 243, 252, 0.42);
  --ink-dim: rgba(224, 242, 254, 0.82);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
html, body { height: 100%; }

body {
  font-family: "Cairo", system-ui, sans-serif;
  color: var(--ink);
  min-height: 100vh;
  background:
    radial-gradient(circle at 10% 10%, #00dfff 0%, transparent 35%),
    radial-gradient(circle at 90% 10%, #a52bff 0%, transparent 35%),
    radial-gradient(circle at 10% 90%, #8c22ff 0%, transparent 35%),
    radial-gradient(circle at 90% 90%, #00d9ff 0%, transparent 35%),
    linear-gradient(135deg, #003b91, #075bdc, #001d69);
  background-attachment: fixed;
  overflow-x: hidden;
  position: relative;
}

:root[data-theme="dark"] body {
  background:
    radial-gradient(circle at 10% 10%, rgba(0, 223, 255, 0.45) 0%, transparent 36%),
    radial-gradient(circle at 90% 10%, rgba(165, 43, 255, 0.45) 0%, transparent 36%),
    radial-gradient(circle at 10% 90%, rgba(140, 34, 255, 0.42) 0%, transparent 36%),
    radial-gradient(circle at 90% 90%, rgba(0, 217, 255, 0.42) 0%, transparent 36%),
    linear-gradient(135deg, #011438, #04245e, #010b26);
}

body::before,
body::after {
  content: "";
  position: fixed;
  width: 350px;
  height: 350px;
  border-radius: 50%;
  filter: blur(110px);
  pointer-events: none;
  z-index: 0;
}

body::before {
  background: #00eaff;
  top: -130px;
  left: -120px;
  opacity: 0.85;
}

body::after {
  background: #a000ff;
  bottom: -150px;
  right: -100px;
  opacity: 0.85;
}

.bubble {
  position: fixed;
  border-radius: 50%;
  pointer-events: none;
  background: radial-gradient(
    circle at 30% 25%,
    rgba(255, 255, 255, 0.78),
    rgba(100, 220, 255, 0.25) 40%,
    rgba(0, 60, 180, 0.2)
  );
  border: 1px solid rgba(255, 255, 255, 0.45);
  box-shadow:
    inset 0 0 15px rgba(255, 255, 255, 0.4),
    0 0 20px rgba(0, 230, 255, 0.25);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  z-index: 0;
}
.bubble-1 { width: 85px; height: 85px; top: 14%; left: 4%; }
.bubble-2 { width: 105px; height: 105px; top: 18%; right: 3%; }
.bubble-3 { width: 50px; height: 50px; top: 64%; left: 2%; }
.bubble-4 { width: 110px; height: 110px; bottom: 8%; right: 5%; }

#app {
  position: relative;
  z-index: 1;
  max-width: 440px;
  margin: 0 auto;
  min-height: 100%;
  padding: calc(12px + env(safe-area-inset-top, 0px)) 14px 124px;
  display: flex;
  flex-direction: column;
}

/* ==========================================================================
   واجهة تسجيل الدخول وإنشاء الحساب (Liquid Glass Login UI)
   ========================================================================== */
.lq-auth-wrap {
  position: relative;
  z-index: 2;
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 12px 0;
  min-height: calc(100vh - 30px);
}

.login-card {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 440px;
  padding: 30px 22px 26px;
  border-radius: 38px;
  background: linear-gradient(
    135deg,
    rgba(255, 255, 255, 0.19),
    rgba(20, 100, 220, 0.12),
    rgba(160, 80, 255, 0.17)
  );
  border: 1.5px solid var(--glass-border);
  backdrop-filter: blur(30px);
  -webkit-backdrop-filter: blur(30px);
  box-shadow:
    inset 0 0 25px rgba(255, 255, 255, 0.17),
    0 0 30px rgba(0, 220, 255, 0.22),
    0 20px 60px rgba(0, 0, 40, 0.3);
  overflow: hidden;
}

.login-card::before {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  background: linear-gradient(
    125deg,
    rgba(255, 255, 255, 0.22),
    transparent 35%,
    transparent 70%,
    rgba(0, 255, 255, 0.12)
  );
  pointer-events: none;
}

.lq-avatar {
  position: relative;
  z-index: 1;
  width: 86px;
  height: 86px;
  margin: 0 auto 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  background: linear-gradient(135deg, rgba(0, 210, 255, 0.55), rgba(100, 50, 255, 0.6));
  border: 2px solid rgba(255, 255, 255, 0.7);
  box-shadow:
    0 0 20px rgba(0, 230, 255, 0.6),
    inset 0 0 20px rgba(255, 255, 255, 0.25);
}

.lq-avatar svg {
  width: 46px;
  height: 46px;
  fill: white;
}

.lq-title {
  position: relative;
  color: white;
  font-size: 28px;
  font-weight: 900;
  text-align: center;
  margin: 0 0 4px;
  text-shadow: 0 2px 10px rgba(0, 0, 40, 0.25);
}

.lq-subtitle {
  position: relative;
  color: rgba(255, 255, 255, 0.88);
  text-align: center;
  font-size: 13.5px;
  font-weight: 600;
  margin: 0 0 22px;
}

.input-box {
  position: relative;
  height: 56px;
  display: flex;
  align-items: center;
  padding: 0 15px;
  margin-bottom: 14px;
  border-radius: 20px;
  border: 1px solid rgba(255, 255, 255, 0.55);
  background: rgba(255, 255, 255, 0.14);
  box-shadow:
    inset 0 0 12px rgba(255, 255, 255, 0.1),
    0 0 12px rgba(0, 200, 255, 0.13);
  transition: .25s;
}

.input-box:focus-within {
  border-color: #72faff;
  box-shadow: 0 0 18px rgba(0, 235, 255, 0.4);
}

.input-box svg {
  width: 23px;
  height: 23px;
  stroke: white;
  fill: none;
  stroke-width: 2;
  flex-shrink: 0;
}

.input-box input {
  width: 100%;
  min-width: 0;
  border: none;
  outline: none;
  background: transparent;
  color: white;
  font: inherit;
  font-size: 14.5px;
  font-weight: 700;
  padding: 0 12px;
}

.input-box input::placeholder {
  color: rgba(255, 255, 255, 0.82);
}

.eye {
  cursor: pointer;
  opacity: .9;
  transition: .2s;
}
.eye:hover {
  opacity: 1;
  filter: drop-shadow(0 0 5px white);
}

.options {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  margin: 14px 4px 18px;
  color: white;
  font-size: 13px;
  font-weight: 700;
}

.remember {
  display: flex;
  align-items: center;
  gap: 7px;
  cursor: pointer;
}

.remember input {
  accent-color: #00eaff;
  width: 16px;
  height: 16px;
  cursor: pointer;
}

.forgot-link {
  background: transparent;
  border: 0;
  color: white;
  font: inherit;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  padding: 0;
}
.forgot-link:hover { text-decoration: underline; }

.login-btn {
  position: relative;
  width: 100%;
  height: 56px;
  border: 1px solid white;
  border-radius: 20px;
  background: linear-gradient(110deg, #00eaff, #8cefff, #b58aff);
  color: #00245f;
  font: inherit;
  font-size: 18px;
  font-weight: 900;
  cursor: pointer;
  box-shadow:
    0 0 20px rgba(0, 230, 255, 0.5),
    inset 0 2px 8px white;
  transition: .25s;
}
.login-btn:active { transform: scale(0.98); }
.login-btn:disabled { opacity: 0.7; cursor: wait; }

.divider {
  display: flex;
  align-items: center;
  gap: 14px;
  color: white;
  font-size: 13px;
  font-weight: 700;
  margin: 16px 0;
}
.divider::before,
.divider::after {
  content: "";
  flex: 1;
  height: 1px;
  background: rgba(255, 255, 255, 0.5);
}

.google-btn {
  width: 100%;
  height: 54px;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 11px;
  border-radius: 20px;
  border: 1px solid rgba(255, 255, 255, 0.85);
  background: linear-gradient(120deg, rgba(255, 255, 255, 0.92), rgba(210, 235, 255, 0.78));
  color: #092c70;
  font: inherit;
  font-size: 15px;
  font-weight: 800;
  cursor: pointer;
  box-shadow:
    0 0 18px rgba(0, 220, 255, 0.3),
    inset 0 2px 8px white;
  transition: .25s;
}
.google-btn:active { transform: scale(0.98); }
.google-btn:disabled { opacity: 0.7; cursor: wait; }

.create-account-btn {
  width: 100%;
  height: 54px;
  margin-top: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  border-radius: 20px;
  border: 1px solid rgba(255, 255, 255, 0.8);
  background: rgba(255, 255, 255, 0.10);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  color: white;
  font: inherit;
  font-size: 15px;
  font-weight: 800;
  cursor: pointer;
  box-shadow:
    inset 0 0 12px rgba(255, 255, 255, 0.15),
    0 0 15px rgba(0, 220, 255, 0.25);
  transition: .25s;
}
.create-account-btn:active { transform: scale(0.98); }
.create-account-btn svg {
  width: 23px;
  height: 23px;
  fill: none;
  stroke: white;
  stroke-width: 1.8;
  flex-shrink: 0;
}

.guest-link {
  display: block;
  margin: 16px auto 0;
  background: transparent;
  border: 0;
  color: rgba(255, 255, 255, 0.92);
  font: inherit;
  font-size: 13px;
  font-weight: 700;
  text-decoration: underline;
  text-underline-offset: 4px;
  cursor: pointer;
}

/* ==========================================================================
   تطبيق هوية Liquid Glass على جميع صفحات التطبيق
   ========================================================================== */
.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 13px;
  gap: 8px;
}

.brand-wrap {
  display: flex;
  align-items: center;
  gap: 7px;
  font-size: 19px;
  font-weight: 900;
  text-shadow: 0 2px 10px rgba(0, 0, 40, 0.35);
  cursor: pointer;
  padding: 5px 14px;
  border-radius: 999px;
  background: linear-gradient(135deg, rgba(255, 255, 255, 0.18), rgba(160, 80, 255, 0.14));
  border: 1px solid rgba(255, 255, 255, 0.45);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  box-shadow: inset 0 0 12px rgba(255, 255, 255, 0.15), 0 0 16px rgba(0, 220, 255, 0.22);
  transition: transform 0.15s ease;
  max-width: 68%;
}
.brand-wrap span:first-child {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.brand-wrap:active { transform: scale(0.97); }

.edit-hint {
  opacity: 0.85;
  display: inline-flex;
  align-items: center;
  flex: none;
}

.glass-circle {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: linear-gradient(135deg, rgba(255, 255, 255, 0.22), rgba(20, 100, 220, 0.14), rgba(160, 80, 255, 0.2));
  border: 1.5px solid var(--glass-border);
  box-shadow: inset 0 0 12px rgba(255, 255, 255, 0.2), 0 0 16px rgba(0, 230, 255, 0.28);
  backdrop-filter: var(--blur);
  -webkit-backdrop-filter: var(--blur);
  color: #fff;
  display: grid;
  place-items: center;
  cursor: pointer;
  position: relative;
  transition: transform 0.15s ease;
  flex: none;
  overflow: hidden;
  padding: 0;
  font-weight: 900;
  font-size: 18px;
}
.glass-circle:active { transform: scale(0.92); }
.glass-circle img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.sync-dot {
  position: absolute;
  bottom: 1px;
  right: 1px;
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: #00eaff;
  border: 1.5px solid #00245f;
  box-shadow: 0 0 8px #00eaff;
}
.sync-dot.syncing { background: #a34cff; animation: pulse 1s infinite; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }

/* شريط التبويبات: العملاء / الموردون */
.seg-wrap {
  display: flex;
  background: linear-gradient(135deg, rgba(255, 255, 255, 0.18), rgba(20, 100, 220, 0.12), rgba(160, 80, 255, 0.16));
  border: 1.5px solid var(--glass-border);
  border-radius: 24px;
  padding: 4px;
  margin-bottom: 12px;
  box-shadow: inset 0 0 18px rgba(255, 255, 255, 0.15), 0 0 22px rgba(0, 220, 255, 0.2);
  backdrop-filter: var(--blur);
  -webkit-backdrop-filter: var(--blur);
}

.seg-btn {
  flex: 1;
  border: 1px solid transparent;
  background: transparent;
  color: rgba(255, 255, 255, 0.9);
  font: inherit;
  font-weight: 800;
  font-size: 14px;
  padding: 8px 10px;
  border-radius: 20px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  transition: all 0.22s ease;
}

.seg-btn.active {
  background: linear-gradient(110deg, #00eaff, #8cefff, #b58aff);
  color: #00245f;
  border: 1px solid #ffffff;
  box-shadow: 0 0 18px rgba(0, 230, 255, 0.48), inset 0 2px 6px #ffffff;
}
.seg-btn.active svg circle,
.seg-btn.active svg rect,
.seg-btn.active svg path {
  stroke: #00245f;
}

/* البطاقات المالية: لي وعليّ */
.cards-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 12px;
}

.stat-card {
  position: relative;
  border-radius: 24px;
  padding: 11px 11px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
  backdrop-filter: var(--blur);
  -webkit-backdrop-filter: var(--blur);
  overflow: hidden;
  border: 1.5px solid var(--glass-border);
  box-shadow: inset 0 0 18px rgba(255, 255, 255, 0.16), 0 0 22px rgba(0, 220, 255, 0.2);
}

.stat-card::before {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(125deg, rgba(255, 255, 255, 0.24), transparent 45%);
  pointer-events: none;
}

.stat-card.green {
  background: linear-gradient(135deg, rgba(255, 255, 255, 0.2), rgba(0, 234, 255, 0.22), rgba(16, 185, 129, 0.22));
}

.stat-card.red {
  background: linear-gradient(135deg, rgba(255, 255, 255, 0.2), rgba(163, 76, 255, 0.24), rgba(244, 63, 94, 0.2));
}

.stat-info {
  text-align: center;
  flex: 1;
}

.stat-label {
  font-size: 12px;
  font-weight: 800;
  color: #ffffff;
  line-height: 1.2;
}

.stat-val {
  font-size: 16.5px;
  font-weight: 900;
  letter-spacing: -0.3px;
  direction: ltr;
  display: inline-block;
  line-height: 1.35;
}

.stat-card.green .stat-val {
  color: #6ee7b7;
  text-shadow: 0 0 12px rgba(0, 234, 255, 0.45);
}

.stat-card.red .stat-val {
  color: #fda4af;
  text-shadow: 0 0 12px rgba(163, 76, 255, 0.45);
}

.icon-3d-box {
  width: 34px;
  height: 34px;
  border-radius: 12px;
  display: grid;
  place-items: center;
  flex: none;
  border: 1px solid rgba(255, 255, 255, 0.7);
}

.icon-3d-box.green {
  background: linear-gradient(135deg, #00eaff, #10b981);
  box-shadow: 0 0 14px rgba(0, 234, 255, 0.45), inset 0 1px 3px #ffffff;
}

.icon-3d-box.red {
  background: linear-gradient(135deg, #a34cff, #f43f5e);
  box-shadow: 0 0 14px rgba(163, 76, 255, 0.45), inset 0 1px 3px #ffffff;
}

/* شريط البحث والفلتر + شريط الفلاتر السريعة */
.search-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 9px;
}

.search-box {
  flex: 1;
  position: relative;
  display: flex;
  align-items: center;
}

.search-box input {
  width: 100%;
  height: 44px;
  border-radius: 20px;
  border: 1px solid rgba(255, 255, 255, 0.58);
  background: rgba(255, 255, 255, 0.14);
  box-shadow: inset 0 0 12px rgba(255, 255, 255, 0.12), 0 0 14px rgba(0, 200, 255, 0.16);
  backdrop-filter: var(--blur);
  -webkit-backdrop-filter: var(--blur);
  color: #fff;
  font: inherit;
  font-size: 13.5px;
  font-weight: 700;
  padding: 0 40px 0 14px;
  outline: none;
  transition: .25s;
}

.search-box input:focus {
  border-color: #72faff;
  box-shadow: 0 0 18px rgba(0, 235, 255, 0.42);
}

.search-box input::placeholder {
  color: rgba(255, 255, 255, 0.82);
}

.search-icon {
  position: absolute;
  right: 14px;
  pointer-events: none;
  opacity: 0.95;
  display: grid;
}

.filter-btn {
  width: 44px;
  height: 44px;
  border-radius: 18px;
  border: 1px solid rgba(255, 255, 255, 0.6);
  background: linear-gradient(135deg, rgba(255, 255, 255, 0.2), rgba(160, 80, 255, 0.18));
  box-shadow: inset 0 0 12px rgba(255, 255, 255, 0.15), 0 0 14px rgba(0, 220, 255, 0.2);
  backdrop-filter: var(--blur);
  -webkit-backdrop-filter: var(--blur);
  color: #fff;
  display: grid;
  place-items: center;
  cursor: pointer;
  flex: none;
}
.filter-btn.active {
  background: linear-gradient(110deg, #00eaff, #8cefff, #b58aff);
  border-color: #ffffff;
  box-shadow: 0 0 20px rgba(0, 230, 255, 0.55);
}
.filter-btn.active svg { stroke: #00245f; }

.chips-row {
  display: flex;
  gap: 7px;
  overflow-x: auto;
  padding-bottom: 4px;
  margin-bottom: 10px;
  scrollbar-width: none;
}
.chips-row::-webkit-scrollbar { display: none; }

.chip-btn {
  flex: none;
  border-radius: 999px;
  padding: 5px 12px;
  font: inherit;
  font-size: 12px;
  font-weight: 800;
  color: #fff;
  background: rgba(255, 255, 255, 0.14);
  border: 1px solid rgba(255, 255, 255, 0.45);
  backdrop-filter: blur(14px);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  transition: 0.2s;
}
.chip-btn.active {
  background: linear-gradient(110deg, #00eaff, #8cefff);
  color: #00245f;
  border-color: #fff;
  box-shadow: 0 0 14px rgba(0, 234, 255, 0.45);
}
.chip-btn.warn.active {
  background: linear-gradient(110deg, #fbbf24, #fde68a);
  color: #451a03;
}

/* شارات التنبيه والتأخير */
.badge-pill {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  font-size: 10.5px;
  font-weight: 800;
  padding: 1.5px 8px;
  border-radius: 999px;
  margin-top: 3px;
}
.badge-pill.overdue {
  background: rgba(244, 63, 94, 0.35);
  border: 1px solid rgba(253, 164, 175, 0.75);
  color: #ffe4e6;
}
.badge-pill.upcoming {
  background: rgba(251, 191, 36, 0.28);
  border: 1px solid rgba(253, 230, 138, 0.7);
  color: #fef3c7;
}

/* بطاقات القائمة الزجاجية السائلة */
.glass-card {
  position: relative;
  background: linear-gradient(
    135deg,
    rgba(255, 255, 255, 0.19),
    rgba(20, 100, 220, 0.12),
    rgba(160, 80, 255, 0.16)
  );
  border: 1.5px solid rgba(255, 255, 255, 0.55);
  border-radius: 24px;
  padding: 11px 13px;
  margin-bottom: 9px;
  display: flex;
  align-items: center;
  gap: 11px;
  box-shadow: inset 0 0 18px rgba(255, 255, 255, 0.14), 0 0 20px rgba(0, 220, 255, 0.16);
  backdrop-filter: var(--blur);
  -webkit-backdrop-filter: var(--blur);
  cursor: pointer;
  transition: transform 0.15s ease, box-shadow 0.2s ease;
  overflow: hidden;
}
.glass-card.is-overdue {
  border-color: rgba(253, 164, 175, 0.85);
  box-shadow: inset 0 0 18px rgba(244, 63, 94, 0.22), 0 0 18px rgba(244, 63, 94, 0.28);
}
.glass-card::before {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(125deg, rgba(255, 255, 255, 0.2), transparent 40%);
  pointer-events: none;
}
.glass-card:active { transform: scale(0.985); }

.avatar-3d {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  background: linear-gradient(135deg, rgba(0, 210, 255, 0.6), rgba(100, 50, 255, 0.65));
  border: 1.5px solid rgba(255, 255, 255, 0.75);

.hero-balance {

.undo-bar{position:fixed;bottom:calc(142px + env(safe-area-inset-bottom,0px));inset-inline:16px;max-width:408px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;border-radius:20px;background:linear-gradient(135deg,rgba(12,65,165,.95),rgba(75,30,155,.95));border:1.5px solid rgba(255,255,255,.65);box-shadow:0 0 22px rgba(0,220,255,.4);z-index:55;font-weight:800;font-size:13.5px;color:#fff}
.undo-bar button{background:linear-gradient(110deg,#00eaff,#8cefff);border:1px solid #fff;color:#00245f;font:inherit;font-weight:900;font-size:13px;padding:6px 16px;border-radius:14px;cursor:pointer}
/* ===== Palette: navy / silver glass ===== */
:root{
  --bg-primary:#031B3B;--bg-secondary:#174B83;--bg-tertiary:#8999B0;
  --background-gradient:linear-gradient(135deg,#031B3B 0%,#07366B 30%,#496A91 65%,#A6B0C1 100%);
  --navy:#082C56;--blue:#1766A5;--silver:#AEBBCB;--light-silver:#E1E8F1;--cyan:#35D9F7;--white:#FFFFFF;--purple:#1766A5;
  --glass-bg:rgba(210,225,245,.13);--glass-border:rgba(255,255,255,.55);--glass-blur:20px;
  --button-gradient:linear-gradient(110deg,#38D7F5 0%,#A8D7F8 48%,#E2E8F2 100%);
  --text-primary:#FFFFFF;--text-dark:#071B35;
  --glow-blue:0 0 20px rgba(53,217,247,.35);--glow-silver:0 0 20px rgba(225,232,241,.30);
}
:root[data-theme="dark"]{--glass-border:rgba(255,255,255,.36);--ink-dim:rgba(225,232,241,.84)}
body{background:var(--background-gradient);background-attachment:fixed;color:var(--text-primary)}
:root[data-theme="dark"] body{background:linear-gradient(135deg,#010c1c 0%,#03234a 32%,#1c3a5c 68%,#4b5a70 100%);background-attachment:fixed}
body::before{background:#35D9F7;opacity:.4}
body::after{background:#1766A5;opacity:.7}
.bubble{background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.75),rgba(174,187,203,.25) 40%,rgba(8,44,86,.2));box-shadow:inset 0 0 15px rgba(255,255,255,.35),0 0 20px rgba(53,217,247,.25)}
.glass-card,.login-card,.brand-wrap,.glass-circle,.seg-wrap,.set-panel,.hero-balance,.act-pill,.filter-btn,.stat-card{
  background:var(--glass-bg);-webkit-backdrop-filter:blur(var(--glass-blur));backdrop-filter:blur(var(--glass-blur));
  border:1px solid var(--glass-border);box-shadow:inset 0 1px 2px rgba(255,255,255,.25),0 8px 25px rgba(0,0,0,.12)
}
.glass-card{border-radius:28px}
.login-btn,.seg-btn.active,.filter-btn.active,.chip-btn.active,.glow-cta,.dual-btn.green,.export-btn.primary,.google-btn-inline,.undo-bar button{
  background:var(--button-gradient);color:var(--text-dark);border:1px solid rgba(255,255,255,.85);box-shadow:var(--glow-blue),inset 0 2px 8px rgba(255,255,255,.65);font-weight:800
}
.dual-btn.red{background:linear-gradient(110deg,#1766A5,#5C93C4);color:#fff;border:1px solid rgba(255,255,255,.7);box-shadow:var(--glow-silver),inset 0 2px 8px rgba(255,255,255,.35)}
.login-btn:active,.glow-cta:active,.dual-btn:active,.export-btn:active{transform:scale(.97)}
.search-box input,.input-box,.sheet-box input,.sheet-box select{background:rgba(210,225,245,.12);color:#fff;border:1px solid rgba(255,255,255,.55);border-radius:25px;-webkit-backdrop-filter:blur(15px);backdrop-filter:blur(15px)}
.search-box input::placeholder,.input-box input::placeholder,.sheet-box input::placeholder{color:rgba(255,255,255,.8)}
.input-box:focus-within,.search-box input:focus,.set-panel input:focus,.sheet-box input:focus{border-color:#35D9F7;box-shadow:var(--glow-blue)}
.sheet-box,.toast,.undo-bar{background:linear-gradient(135deg,rgba(8,44,86,.95),rgba(3,27,59,.97))}
.sheet-backdrop{background:rgba(3,27,59,.55)}
.avatar-3d,.lq-avatar,.set-hero-icon,.set-mini-badge,.user-avatar-lg{background:linear-gradient(135deg,rgba(53,217,247,.55),rgba(23,102,165,.75))}
.set-hero-title::after{background:linear-gradient(90deg,#35D9F7,#E1E8F1)}
.set-reset-icon{background:linear-gradient(135deg,#35D9F7,#1766A5)}
.sync-dot{background:#35D9F7}.sync-dot.syncing{background:#AEBBCB}
.remember input{accent-color:#35D9F7}
/* compact, harmonious buttons */
.login-btn,.google-btn,.create-account-btn{height:46px;font-size:16px;border-radius:18px}
.google-btn-inline{height:42px;border-radius:16px}
.glow-cta{padding:8px 24px;font-size:14.5px;border-radius:18px}
.dual-btn{padding:9px 12px;font-size:14px;border-radius:18px}
.export-btn{padding:7px 8px;font-size:12px;border-radius:14px}
.seg-btn{padding:6px 10px}
.filter-btn{width:40px;height:40px;border-radius:15px}
.input-box{height:48px}
/* animated bottom bar */
.nav-dock{background:rgba(8,44,86,.42);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.55);border-radius:30px}
.nav-item{position:relative;z-index:1;padding:5px 4px;background:transparent;transition:color .35s}
.nav-item.active{background:transparent;border-color:transparent;box-shadow:none;color:var(--text-dark)}
.nav-ind{position:absolute;top:5px;bottom:5px;inset-inline-start:5px;width:calc((100% - 20px)/3);border-radius:24px;background:var(--button-gradient);border:1px solid #fff;box-shadow:var(--glow-blue),inset 0 2px 8px rgba(255,255,255,.65);transform:translateX(calc(var(--i,0) * -1 * (100% + 5px)));transition:transform .5s cubic-bezier(.34,1.4,.5,1),opacity .25s;z-index:0;pointer-events:none}
.nav-ind.off{opacity:0}
/* ===== Liquid glass effect ===== */
body{background:var(--background-gradient);background-attachment:fixed;color:var(--text-primary);min-height:100vh}
:root[data-theme="dark"] body{background:linear-gradient(135deg,#010c1c 0%,#03234a 32%,#1c3a5c 68%,#4b5a70 100%);background-attachment:fixed}
.glass-card,.login-card,.brand-wrap,.glass-circle,.seg-wrap,.set-panel,.hero-balance,.act-pill,.stat-card,.filter-btn{
  background:linear-gradient(135deg,rgba(255,255,255,.16),rgba(255,255,255,0) 45%),var(--glass-bg);
  -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);
  border:1px solid var(--glass-border);
  box-shadow:inset 0 1px 3px rgba(255,255,255,.3),0 8px 25px rgba(0,0,0,.12)
}
.glass-card{border-radius:28px}
.login-btn,.google-btn,.create-account-btn,.glow-cta,.dual-btn,.google-btn-inline,.export-btn.primary{
  border-radius:26px;border:1px solid rgba(255,255,255,.9);font-weight:800
}
.login-btn,.glow-cta,.dual-btn.green,.google-btn-inline,.export-btn.primary,.seg-btn.active,.filter-btn.active,.chip-btn.active{
  background:var(--button-gradient);color:var(--text-dark);
  box-shadow:var(--glow-blue),inset 0 2px 8px rgba(255,255,255,.65)
}
.seg-btn.active{border-radius:22px}
.nav-dock{background:rgba(180,200,225,.16);-webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px);border:1px solid rgba(255,255,255,.65);border-radius:35px;box-shadow:inset 0 1px 3px rgba(255,255,255,.3),0 8px 25px rgba(0,0,0,.12)}
.nav-ind{background:var(--button-gradient);border:1px solid #fff;border-radius:25px;box-shadow:var(--glow-blue),inset 0 2px 8px rgba(255,255,255,.65)}
.search-box input,.input-box{background:rgba(220,230,245,.13);border:1px solid rgba(255,255,255,.55);border-radius:25px;color:#fff}
.search-box input::placeholder,.input-box input::placeholder{color:rgba(255,255,255,.85)}
/* ===== App lock ===== */
.lock-wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;min-height:calc(100vh - 40px);text-align:center;padding:0 8px}
.pin-dots{display:flex;gap:14px;margin:6px 0 12px;min-height:16px}
.pin-dot{width:14px;height:14px;border-radius:50%;border:1.5px solid #fff;transition:.2s}
.pin-dot.on{background:#35D9F7;border-color:#35D9F7;box-shadow:var(--glow-blue)}
.pin-pad{display:grid;grid-template-columns:repeat(3,72px);gap:14px;direction:ltr}
.pin-key{height:72px;border-radius:50%;background:linear-gradient(135deg,rgba(255,255,255,.16),rgba(255,255,255,0) 45%),var(--glass-bg);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border:1px solid var(--glass-border);box-shadow:inset 0 1px 3px rgba(255,255,255,.3),0 8px 25px rgba(0,0,0,.12);color:#fff;font:inherit;font-size:25px;font-weight:800;cursor:pointer;transition:transform .12s}
.pin-key:active{transform:scale(.92);background:var(--button-gradient);color:var(--text-dark)}
.pin-key.ghost{background:transparent;border-color:transparent;box-shadow:none;font-size:22px}
.pin-forgot{background:none;border:0;color:rgba(255,255,255,.85);font:inherit;font-size:13px;font-weight:700;cursor:pointer;margin-top:6px;text-decoration:underline}
@keyframes pinshake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
.shake{animation:pinshake .4s}
/* PIN fields in sheets: same size as other inputs */
.sheet-box input[type="password"]{display:block;width:100%;height:48px;padding:0 15px;margin-top:10px;font:inherit;font-size:16px;font-weight:700;color:#fff;outline:none;text-align:center;letter-spacing:8px;border-radius:25px;box-sizing:border-box}
.sheet-box input[type="password"]::placeholder{letter-spacing:0;font-size:14px;font-weight:600}
.sheet-box>b{display:block;margin-bottom:4px}
/* chart + day summary */
.mbar{width:13px;border-radius:7px 7px 2px 2px}
.mbar.in{background:linear-gradient(180deg,#34d399,#00eaff)}
.mbar.out{background:linear-gradient(180deg,#fb7185,#a34cff)}
.day-row{display:flex;justify-content:space-between;align-items:center;font-size:13px;margin-bottom:7px}
.set-panel input[type="date"]{display:block;width:100%;height:46px;padding:0 14px;font:inherit;font-size:15px;color:#fff;border-radius:22px;box-sizing:border-box}
</style>
